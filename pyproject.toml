[project]
name = "mp-handouts"
version = "0.1.0"
description = "Mood Patterns Therapist Voucher & Handout Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "qrcode[pil]>=7.4.2",
    "reportlab>=4.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
mp-handouts = "mp_handouts.cli:app"

[dependency-groups]
dev = [
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mp_handouts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

